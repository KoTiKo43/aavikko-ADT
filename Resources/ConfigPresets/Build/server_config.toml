# ============================================================
# СЕТЬ
# ============================================================
[net]

# Максимум одновременно подключённых клиентов с одного IP
#max_ip_connections = 150 (Выкл для ADT)

# Максимум попыток подключения с одного IP за окно времени
#max_rapid_connections = 60 (Выкл для ADT)

# Длина окна для rapid-limit, секунд
rapid_connection_window = 30

# Сколько старых попыток забывать за каждое окно
rapid_connection_decay = 30

send_connection_rejection_reasons = true

tickrate = 30                    # Тиков в секунду (30 — стандарт)
port = 1212                      # Порт сервера
# Макс. одновременных подключений (включая админов) (дефолт: 256)
#max_ip_connections = 8           # Макс. подключений с одного IP (анти-мультиакк)

# ============================================================
# ИГРА
# ============================================================
[game]
hostname = "🪐  Aavikko Galaxy | MRP+"     # Имя сервера в списке
desc = """
Динамичный лор, фракции игроков и свобода RP отыгрыша!
Блюспейс-разлом открыл путь в загадочную галактику Аавикко, полную тайн, древних руин и новых угроз.

Наши особенности:
🎭 Свобода RP без излишней душки.
🌌 Авторская галактика.
🏴 Фракции игроков с влиянием на мир.
📖 Лор, развивающийся благодаря вашим действиям.
👹 Уникальные расы - синтетики Геты с коллективным ИИ и орки!

Создавайте фракции. Пишите собственные истории. Меняйте галактику вместе с другими игроками.
Мы рады встрече с тобой, скиталец!
"""
soft_max_players = 60            # Мягкий лимит игроков (включая админов)
lobbyduration = 180              # Таймер лобби (сек)
map_pool = "AavikkoMapPool"      # Пул карт для ротации
#defaultpreset = "secret"         # Пресет раунда по умолчанию (дефолт)
fallbackpreset = "Extended"      # Fallback-пресет (дефолт: "Traitor,Extended")
#round_restart_time = 120         # Время до рестарта (сек) (дефолт)
maxcharacterslots = 10           # Макс. слотов персонажей (дефолт: 30)
role_loadout_timers = false
role_timers = false
auto_map_vote = true
#minimum_job_fallback = 3     # (Выкл для ADT) Закидывание за роль командования при низком количестве людей в отделе (дефолт: 2; 3 - отключить)
# --- Panic Bunker (защита от рейдов) ---
[game.panic_bunker]
#enabled = false                  # Включить panic bunker (дефолт)
#disable_with_admins = true       # Отключать при появлении админа (дефолт: false)
#enable_without_admins = false    # Включать когда нет админов (дефолт)
#show_reason = true               # Показывать причину отказа (дефолт: false)
#min_account_age = 1440           # Мин. возраст аккаунта (минут) (дефолт)
#min_overall_minutes = 600        # Мин. общее время игры (минут) (дефолт)

# --- IPIntel (анти-VPN) ---
[game.ipintel]
#ipintel_enabled = false          # Включить проверку IPIntel (дефолт)
#ipintel_contact_email = ""       # Обязательный email для IPIntel (дефолт)
#ipintel_bad_rating = 0.95        # Рейтинг для отказа (0-1) (дефолт)

# ============================================================
# IC (внутриигровой контент)
# ============================================================
[ic]
flavor_text = true              # Разрешить flavor text (описание персонажа) (дефолт: false)
flavor_text_length = 1024        # Макс. длина flavor text (дефолт: 512)
#restricted_names = true          # Ограничить имена алфавитно-цифровыми (дефолт)
#name_length = 32                 # Макс. длина имени (дефолт)
#punctuation = false              # Автодобавление точки в конце (дефолт)
ssd_sleep_time = 600             # Время до засыпания SSD (сек)

# ============================================================
# АДМИНИСТРИРОВАНИЕ
# ============================================================
[admin]
see_own_notes = true            # Игроки видят свои note'ы (дефолт: false)
#admins_count_in_playercount = false  # Админы в счётчике игроков (дефолт)
#deadmin_on_join = false          # Деадмин при входе в раунд (дефолт)
#new_player_threshold = 0         # Порог "нового игрока" (минут) (дефолт)
#afk_time = 10800                 # AFK-таймаут админа (сек, 3 часа) (дефолт)
# ID канала для relay админ-чата в Discord
#chat_discord_channel_id = ""     # (дефолт)

# --- Ahelp ---
[ahelp]
#rate_limit_period = 2.0          # Период rate limit (сек) (дефолт)
#rate_limit_count = 10            # Сообщений в период (дефолт)

# ============================================================
# СЕРВЕР
# ============================================================
[server]
id = "aavikko_main"               # Уникальный ID (для раздельного хранения changelog/rules)
rules_file = "DefaultRuleset"     # Прототип правил
#default_guide = "NewPlayer"      # Гайд по умолчанию
#uptime_restart_minutes = 0       # Авто-рестарт через N минут (0 = выкл)
#lobby_name = ""                  # Заголовок в лобби

[auth]
mode = 1

[rules]
time = 25.0                      # Время ожидания перед принятием правил (сек) (дефолт: 45)

# ============================================================
# ШАТТЛЫ
# ============================================================
[shuttle]
emergency_early_launch_allowed = true  # Разрешить ранний запуск (дефолт: false)
auto_call_time = 150             # Авто-вызов шаттла через N минут (0 = выкл) (дефолт: 90)
arrivals_map = "/Maps/Corvax/Misc/corvax_terminal.yml"  # (дефолт: /Maps/Misc/terminal.yml)

# ============================================================
# БАЗА ДАННЫХ
# ============================================================
[database]
engine = "sqlite"                # "sqlite" или "postgres"
# Для SQLite:
sqlite_dbpath = "preferences.db"
# Для PostgreSQL (если engine = "postgres"):
#pg_host = "localhost"
#pg_port = 5432
#pg_database = "ss14"
#pg_username = "postgres"
#pg_password = "твой_пароль"

# ============================================================
# ЧАТ
# ============================================================
[chat]
motd = "Разморозка уже здесь!"    # Message of the day
#max_message_length = 1000        # Макс. длина сообщения (дефолт)
#max_announcement_length = 256    # Макс. длина анонса (дефолт)
#rate_limit_period = 2.0          # Период rate limit (сек) (дефолт)
#rate_limit_count = 10            # Сообщений в период (дефолт)
#show_typing_indicator = true     # Индикатор печати (дефолт)

# ============================================================
# ГОЛОСОВАНИЯ
# ============================================================
[vote]
map_enabled = true               # Разрешить голосование за карту (дефолт: false)
#restart_max_players = 20         # Макс. игроков для restart-голосования (дефолт)
#restart_required_ratio = 0.85    # Нужный процент для рестарта (дефолт)
#same_type_timeout = 240.0        # Кулдаун между голосованиями (сек) (дефолт)

[votekick]
#enabled = true                   # Включить votekick
#eligible_number = 5              # Мин. голосующих
#required_ratio = 0.6             # Нужный процент
#not_allowed_when_admin_online = true  # Запрет при админе

# ============================================================
# ВАЙТЛИСТ
# ============================================================
[whitelist]
#enabled = false                  # Включить вайтлист (дефолт)

# ============================================================
# ХАБ (публичный список серверов)
# ============================================================
[hub]
advertise = true                # Рекламировать на хабе (true для публичного сервера)
tags = "lang:ru,region:eu_e,rp:med,rp:hard"                        # Теги (через запятую, напр. "lang:ru,rp:med")
hub_urls = "https://hub.spacestation14.com/"  # (дефолт)
server_url = "ss14://aavikko.space:1212"        # URL сервера (ss14://domain:port)

# ============================================================
# ССЫЛКИ В ЛАУНЧЕРЕ
# ============================================================
[infolinks]
discord = "https://discord.gg/MvkfTSz3mr"
github = ""
website = ""
wiki = "https://aavikko.space/wiki"
patreon = ""
bug_report = ""
appeal = ""
telegram = ""

# ============================================================
# АТМОСФЕРА
# ============================================================

[atmos]
space_wind = true                # Космический ветер (дефолт: false)
max_explosion_range = 5         # Макс. радиус взрыва (0 = отключить взрывы) (дефолт: 24)
#monstermos = true                # Включить monstermos (дефолт)
#atmos_tick_rate = 15             # Тики атмосферы/сек (дефолт)

# ============================================================
# ЛОГИРОВАНИЕ
# ============================================================
[log]
#level = 2                        # 0=verbose, 1=debug, 2=info, 3=warnings, 4=errors, 5=fatal (дефолт)
#enabled = true                   # Записывать логи на диск (дефолт)
#path = "logs"                    # Папка логов (дефолт)

[adminlogs]
#enabled = true                   # Включить админ-логи (дефолт)
server_name = "aavikko"        # Имя сервера в логах

# ============================================================
# КОНСОЛЬ
# ============================================================
[console]
loginlocal = false                # Авто-админ с localhost (ВЫКЛЮЧИТЬ для публика!) (дефолт: true)
login_host_user = "DrMiheto"             # Имя игрока для авто-админа (дефолт)

# ============================================================
# DISCORD
# ============================================================
[discord]
# ID роли для пинга при SOS (правый клик по роли → Copy ID)
on_call_ping = "1204839479085375540"

# ID роли для пинга при окончании раунда
round_end_role = "1249064881102131304"

# (Опц.) Иконка сервера в footer'е ahelp-embed'а (URL картинки)
#ahelp_footer_icon = "https://i.imgur.com/your_icon.png"

# (Опц.) Аватар для webhook'а ahelp (URL картинки)
#ahelp_avatar = "https://i.imgur.com/your_avatar.png"
# Диспетчер Элин
guild_id = "1204836963576709140"
prefix = "!"
